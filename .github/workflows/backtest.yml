name: Backtest

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Account (solana_15m or swing_6h)"
        default: "solana_15m"
      days:
        description: "Days of history (blank = account default)"
        default: ""

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m bot.backtest "${{ inputs.account }}" ${{ inputs.days }}
      - name: Commit backtest results
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add docs/data/*_backtest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update ${{ inputs.account }} backtest"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
