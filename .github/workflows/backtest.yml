name: Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history"
        default: "1460"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m bot.backtest "${{ inputs.days }}"
      - name: Commit backtest results
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add docs/data/backtest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update backtest"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
