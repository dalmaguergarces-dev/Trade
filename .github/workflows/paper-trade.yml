name: Paper trade

on:
  schedule:
    - cron: "7 * * * *"   # hourly; the bot acts when a new 6h candle has closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m bot.run
      - name: Commit updated state
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add docs/data/state.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Paper trade update"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
