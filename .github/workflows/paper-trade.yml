name: Paper trade

on:
  schedule:
    - cron: "*/15 * * * *"   # each account acts only when one of its candles has closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bots
        id: run
        continue-on-error: true   # still save accounts that succeeded
        run: python -m bot.run
      - name: Live wallet
        id: live
        # Only when the LIVE_TRADING repository variable is "dry" or "on".
        if: vars.LIVE_TRADING == 'dry' || vars.LIVE_TRADING == 'on'
        continue-on-error: true
        env:
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          SOLANA_BOT_KEY: ${{ secrets.SOLANA_BOT_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          pip install --quiet -r requirements.txt
          python -m bot.live
      - name: Commit updated state
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add docs/data/*.json
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "Paper trade update"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
      - name: Report failure
        if: steps.run.outcome == 'failure' || steps.live.outcome == 'failure'
        run: exit 1
